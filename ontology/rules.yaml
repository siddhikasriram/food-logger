version: 1
rules:
  - id: ontology_items_include_all_scope
    name: All scope membership
    description: Every canonical ontology item must belong to the all scope.
    condition: all is present in scopes
    effect: reject ontology synchronization when absent
    scopes: [all]

  - id: logging_requires_confirmation
    name: Confirmation before logging
    description: A meal log is persisted only after explicit user confirmation.
    condition: chat status is awaiting_confirmation
    effect: permit creation of a meal_log
    scopes: [all, logging]

  - id: meal_log_requires_user_and_recipe
    name: Required meal references
    description: Every meal log references an existing user and recipe.
    condition: user_id and recipe_id resolve
    effect: permit creation of a meal_log
    scopes: [all, logging]

  - id: meal_type_is_allowlisted
    name: Allowed meal type
    description: Meal type must be breakfast, lunch, dinner, or snack.
    condition: meal_type is in meal_type.attributes
    effect: accept meal_type
    scopes: [all, logging]

  - id: servings_are_positive
    name: Positive servings
    description: Recipe and meal serving counts must be greater than zero.
    condition: servings > 0
    effect: accept servings
    scopes: [all, logging]

  - id: ingredient_quantity_is_positive_grams
    name: Positive gram quantity
    description: Recipe ingredient quantities must be positive and stored in grams.
    condition: quantity.amount > 0 and quantity.unit == g
    effect: accept quantity
    scopes: [all, logging]

  - id: ingredient_name_is_unique
    name: Unique ingredient name
    description: Ingredient names are unique under case-insensitive matching.
    condition: no canonical ingredient has the same normalized name
    effect: permit creation of an ingredient
    scopes: [all, logging]

  - id: nutrition_scales_by_weight
    name: Nutrition weight scaling
    description: Ingredient nutrients scale from per-100-gram values by quantity.
    condition: quantity_g is known
    effect: nutrient_total = nutrient_per_100g * quantity_g / 100
    scopes: [all, logging]

  - id: recipe_nutrition_is_additive
    name: Additive recipe nutrition
    description: Recipe nutrition is the sum of its scaled ingredient nutrition.
    condition: every recipe ingredient has nutrition values and quantity_g
    effect: recipe nutrients equal the sum of ingredient nutrient totals
    scopes: [all, logging]

  - id: llm_estimates_are_labeled
    name: Label estimated nutrition
    description: LLM-generated ingredient nutrition must retain its estimate provenance.
    condition: nutrition values were generated by the language model
    effect: nutrition_source = llm_estimate
    scopes: [all, logging]

  - id: shared_recipe_visibility
    name: Shared recipe visibility
    description: Recipes and ingredients are shared across users.
    condition: a recipe or ingredient exists
    effect: make it available to every user
    scopes: [all]
